# Proxy source networks are intentionally narrow; update this list when the
# deployment's TLS reverse proxy uses a different private network.
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $trusted_proxy {
  default 0;
  127.0.0.1/32 1;
}

map "$trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
  default $scheme;
  "1:https" https;
  "1:http" http;
}

map $forwarded_proto $hsts_value {
  default "";
  https "max-age=31536000; includeSubDomains";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # The container listens on 8080 but is commonly published on another host
  # port (5173 in the compose stack). Keep directory redirects relative so
  # `/manual` never leaks the container port into the browser URL.
  port_in_redirect off;
  client_max_body_size 5m;
  client_body_timeout 10s;
  keepalive_timeout 65s;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security $hsts_value always;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
